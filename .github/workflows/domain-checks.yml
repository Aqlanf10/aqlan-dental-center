name: Domain foundation checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: domain-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit locked dependencies
        run: npm audit --package-lock-only --include=dev --audit-level=moderate
      - name: Strict TypeScript and syntax checks
        run: npm run check
      - name: Run synthetic domain tests
        run: npm test
