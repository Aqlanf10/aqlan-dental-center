name: PostgreSQL finance persistence checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: postgres-finance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-finance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        # Official postgres:18.6 multi-platform digest, verified 2026-10-19:
        # https://hub.docker.com/v2/repositories/library/postgres/tags/18.6
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: finance_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run disposable PostgreSQL finance tests
        env:
          FINANCE_TEST_DATABASE_URL: postgres://postgres:synthetic-only@localhost:5432/finance_test
          FINANCE_TEST_DISPOSABLE: '1'
        run: npm run test:postgres
